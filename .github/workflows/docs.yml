name: Docs

# The documentation site: its pictures made from the example run
# (tools/docs_images.py, offscreen with Mesa's software Vulkan driver), the site
# built strictly (a broken link fails), and on main published to GitHub Pages
# (Settings → Pages → Source: GitHub Actions).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Software GPU libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 \
            mesa-vulkan-drivers

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./lagoon-format -e ".[docs]"

      - name: Pictures
        run: python tools/docs_images.py

      - name: Build
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
