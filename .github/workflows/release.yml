name: Release

# A tag v<version> (the version in src/lagoonviz/__init__.py) builds both packages,
# tests the built wheels on macOS, Linux and Windows, publishes them to PyPI
# (trusted publishing; a lagoon-format version already there is skipped) and makes
# the GitHub release with the changelog's section as its notes. Run by hand
# (workflow_dispatch), it builds and tests only: a dry run. See RELEASING.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: Build the packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tag, version and changelog agree
        if: startsWith(github.ref, 'refs/tags/')
        run: python tools/release_notes.py --check "$GITHUB_REF_NAME"

      - name: Build sdists and wheels
        run: |
          python -m pip install --upgrade build "twine>=6.1"
          python -m build --outdir dist .
          python -m build --outdir dist lagoon-format
          python -m twine check --strict dist/*
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          if-no-files-found: error

  test:
    name: Wheels on ${{ matrix.os }} / Python ${{ matrix.python }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4  # the tests; the code comes from the wheels

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Qt and software GPU libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 \
            mesa-vulkan-drivers

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Install the built wheels
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/lagoon_format-*.whl dist/lagoon_viz-*.whl \
            pytest pytest-qt "zarr>=3"
          python -m pip check

      - name: The commands start
        run: |
          lagoon --version
          lagoon-render --help > /dev/null
          lagoon-convert --help > /dev/null
          python -c "import lagoonviz, lagoon_format; print(lagoonviz.__version__, lagoon_format.__version__)"

      - name: Tests against the installed packages
        run: |
          # the sources must not shadow the wheels
          mv src src.unused
          python -m pytest -q -rs -p no:cacheprovider tests

  publish:
    name: Publish to PyPI
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/lagoon-viz/
    permissions:
      id-token: write  # trusted publishing: no token stored in the repository
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true  # lagoon-format is uploaded only when its version is new

  github-release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Release with the changelog's notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/release_notes.py "$GITHUB_REF_NAME" > notes.md
          flags=()
          if [[ "$GITHUB_REF_NAME" =~ (a|b|rc)[0-9]+$ ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "LAGOON ${GITHUB_REF_NAME#v}" --notes-file notes.md "${flags[@]}"
