name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Qt and software GPU libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 \
            mesa-vulkan-drivers

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./lagoon-format -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Layer rules (core never imports Qt)
        run: lint-imports

      - name: Tests
        run: pytest -v -rs
        env:
          LAGOON_TEST_OUTPUT: test-output

      - name: Rendered test images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renders-${{ matrix.os }}-py${{ matrix.python }}
          path: test-output
          if-no-files-found: ignore
