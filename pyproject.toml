[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "lagoon-viz"
dynamic = ["version"]  # from src/lagoonviz/__init__.py
description = "LAGOON: Lightweight Animation and Graphics for Open Ocean Numerics"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Hans Bihs" }]
requires-python = ">=3.11"
keywords = ["REEF3D", "CFD", "ocean", "coastal", "visualization", "post-processing", "waves"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Hydrology",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "lagoon-format>=0.5.0,<0.6",
    "numpy>=1.24",
    "PySide6-Essentials>=6.7",
    "pygfx>=0.9",
    "rendercanvas>=1.0",
    "imageio-ffmpeg>=0.5",  # MP4 export; brings its own ffmpeg
    "matplotlib>=3.8",  # paper figures (File > Export figure)
    "pillow>=9.5",  # map tiles, GeoTIFF without rasterio
    "scipy>=1.10",  # bathymetry onto the grid (TIN, inverse distance)
    "openpyxl>=3.1",  # 2D plots: tables from Excel files
]

[project.optional-dependencies]
# the Earth under a case: any CRS (pyproj), any GeoTIFF read in windows (rasterio),
# ICESat-2's nearshore soundings (h5py); without them LAGOON knows WGS 84, ETRS89,
# Web Mercator, UTM and NTM and reads plain GeoTIFFs itself
geo = [
    "pyproj>=3.6",
    "rasterio>=1.3",
    "h5py>=3.8",
]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "ruff>=0.6",
    "import-linter>=2.1",
    "zarr>=3",  # tests: LAGOON stores open in zarr-python
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]

[project.scripts]
lagoon = "lagoonviz.gui.app:main"
lagoon-render = "lagoonviz.render.offscreen:main"
lagoon-convert = "lagoonviz.core.convert:main"
lagoon-setup = "lagoonviz.render.setup_sketch:main"

[project.urls]
Homepage = "https://github.com/REEF3D/LAGOON"
Documentation = "https://reef3d.github.io/LAGOON/"
Issues = "https://github.com/REEF3D/LAGOON/issues"
Changelog = "https://github.com/REEF3D/LAGOON/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/lagoonviz/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/lagoonviz"]

# the source package: the application, its tests and the docs that describe it; the
# format library is its own package (lagoon-format/), the logo drafts and the
# planning documents stay in the repository
[tool.hatch.build.targets.sdist]
only-include = [
    "src",
    "tests",
    "docs/architecture.md",
    "README.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "AUTHORS.md",
    "LICENSE",
    "pyproject.toml",
]

# ---------------------------------------------------------------- tests
[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

# ---------------------------------------------------------------- lint
[tool.ruff]
line-length = 100
target-version = "py311"
# logo: the drawing script of the logo; Markdown: its code examples keep their
# aligned comments (newer ruff versions format code blocks in Markdown too)
extend-exclude = ["lagoon-format/build", "logo", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

# ---------------------------------------------------------------- layer rules
# Checked in CI with `lint-imports`. The core must stay usable without a GUI or GPU.
[tool.importlinter]
root_packages = ["lagoonviz", "lagoon_format"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: gui -> render -> core"
type = "layers"
layers = ["lagoonviz.gui", "lagoonviz.render", "lagoonviz.core"]

[[tool.importlinter.contracts]]
name = "Core stays free of Qt, GPU and plotting libraries"
type = "forbidden"
source_modules = ["lagoonviz.core"]
forbidden_modules = ["PySide6", "pygfx", "wgpu", "rendercanvas", "matplotlib", "lagoonviz.gui", "lagoonviz.render", "lagoonviz.plugins"]

[[tool.importlinter.contracts]]
name = "Render does not use Qt"
type = "forbidden"
source_modules = ["lagoonviz.render"]
forbidden_modules = ["PySide6", "lagoonviz.gui"]

[[tool.importlinter.contracts]]
name = "Plugins do not use the GUI"
type = "forbidden"
source_modules = ["lagoonviz.plugins"]
forbidden_modules = ["PySide6", "lagoonviz.gui"]

[[tool.importlinter.contracts]]
name = "Format library (MIT) is independent of the application (GPLv3)"
type = "forbidden"
source_modules = ["lagoon_format"]
forbidden_modules = ["lagoonviz"]
